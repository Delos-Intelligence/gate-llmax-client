# Publish gate-llmax to PyPI on a GitHub Release.
#
# One-time setup: create the `gate-llmax` project on PyPI and add a Trusted Publisher
# (https://pypi.org/manage/account/publishing/) for this repo + workflow `publish-pypi.yml`.
# No API token needed — publishing uses OIDC.
#
# `uv build` produces one wheel + sdist for the single `gate_llmax` import package.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv tool run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
