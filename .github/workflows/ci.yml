name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync environment
        # `--extra agent` installs `mcp`, which `ty check src` needs to resolve the
        # imports in agent/cli.py and agent/mcp_server.py.
        run: uv sync --group dev --extra agent

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: ty check
        run: uv run ty check src

      - name: Unit tests
        # test_client.py is an integration suite that needs a live Gate server; the
        # rest run offline. Skip the integration module in CI.
        run: uv run pytest tests --ignore=tests/test_client.py
