[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gate-llmax"
version = "0.4.16"
description = "Gate LLM Gateway – Python client SDK and shared types"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Delos Intelligence" }]
requires-python = ">=3.12"  # PEP 695 generics need 3.12+
keywords = ["llm", "gateway", "ai", "openai", "client", "sdk", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# `agent` powers `gate-llmax agent mcp` (the Gate MCP server). The core client SDK needs none of it.
agent = ["mcp>=1.2"]

[project.scripts]
gate-llmax = "gate_llmax.agent.cli:main"

[project.urls]
Repository = "https://github.com/Delos-Intelligence/gate-llmax-client"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
    "ruff>=0.9",
    "ty>=0.0.1a8",
]

# Single import package `gate_llmax`: the client SDK (client, request builders,
# streaming, tokens) plus `gate_llmax.models` + `gate_llmax.types` — the shared
# Pydantic models / type aliases the Gate backend imports too.
[tool.hatch.build.targets.wheel]
packages = ["src/gate_llmax"]
# The packaged agent skill (Markdown) ships in the wheel so `gate-llmax agent install` can write it.
force-include = { "src/gate_llmax/agent/skill/SKILL.md" = "gate_llmax/agent/skill/SKILL.md" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Type annotations – not enforced at this stage
    "ANN",
    # Formatter conflicts
    "COM812",
    "ISC001",
    # Opinionated style rules we disagree with
    "ERA001",   # commented-out code
    "FIX002",   # TODO comments
    "TD002", "TD003",
    "TRY003",   # long exception messages
    "EM101", "EM102",
    "BLE001",   # blind except
    "S101",     # assert usage
    # Relative cross-package imports are idiomatic in packages
    "TID252",
    "FBT001",
    "PLR0913", # too many args
    # TYPE_CHECKING block suggestions – optional style, not enforced
    "TC001", "TC002", "TC003",
    "ASYNC109", # timeout in async function : we have retries on top
    # Unicode dashes / arrows in docstrings are fine
    "RUF001", "RUF002", "RUF003",
    # Local imports used intentionally to break circular dependencies
    "PLC0415",
    # Magic value comparisons are expected in adapter code
    "PLR2004",
    # Unused args in interface stub methods (raise TypeError bodies)
    "ARG002",
    "C901",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401", "D103", "D101", "SLF001"]
# The CLI's stdout is its user interface — `print` is intended output, not a stray debug line.
"src/gate_llmax/agent/cli.py" = ["T201"]
